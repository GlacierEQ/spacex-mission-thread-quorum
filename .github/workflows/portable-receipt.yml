name: Portable Quorum Receipt
on:
  push:
    paths:
      - 'src/portable_receipt.py'
      - 'tests/test_portable_receipt_contract.py'
      - 'scripts/operate_portable.py'
      - '.github/workflows/portable-receipt.yml'
  pull_request:
    paths:
      - 'src/portable_receipt.py'
      - 'tests/test_portable_receipt_contract.py'
      - 'scripts/operate_portable.py'
      - '.github/workflows/portable-receipt.yml'
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_portable_receipt_contract -v
      - run: python scripts/operate_portable.py
